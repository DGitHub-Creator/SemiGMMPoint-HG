model:
  NAME: PreGMMBaseSeg
  encoder_args:
    NAME: PointNextEncoder
    blocks: [1, 3, 5, 3, 3]
    strides: [1, 4, 4, 4, 4]
    sa_layers: 1
    sa_use_res: False
    width: 32
    in_channels: 4
    expansion: 4
    radius: 0.1
    nsample: 32
    aggr_args:
      feature_type: 'dp_fj'
      reduction: 'max'
    group_args:
      NAME: 'ballquery'
      normalize_dp: True
    conv_args:
      order: conv-norm-act
    act_args:
      act: 'relu'
    norm_args:
      norm: 'bn'
  decoder_args:
    NAME: GMMPointNextDecoder
  cls_args:
    NAME: PointNextGMMSeg
    num_classes: 6
    ignore_index: 255
decoder_params:
    embed_dim: 64
    num_components: 5
    factor_n: 1
    factor_c: 1
    factor_p: 1
    mem_size: 36000
    max_sample_size: 40
    update_GMM_interval: 5
    update_loop: 5
is_pretrain: True
criterion_args:
  NAME: GudiePointContrastLoss
  label_smoothing: 0.1
  npos: 4096
  T: 0.4
  is_guide: False
  ignore_index: 255
  max_guide_iter: 10
preLoadGMMConfig:
  is_load_gmm: True
  pretrain_path: /
pretrained_module: encoder,decoder,head
pretrained_path:
dataset:
  common:
    NAME: ODPTPreS3DISHG
    dataset_root: /path/to/odpt-hg-dataset
    data_root: /path/to/odpt-hg-data
    split_file: splits/100.txt
    val_scenes: [Area_1_conferenceRoom_3, Area_1_conferenceRoom_7]
    voxel_size: 0.04
  train:
    split: train
    mode: pretrain
    voxel_max: 24000
    loop: 30
    presample: False
  val:
    split: val
    mode: pretrain
    voxel_max: null
    presample: False
  test:
    split: test
    mode: test
    voxel_max: null
    presample: False
batch_size: 4
# ---------------------------------------------------------------------------- #
# ODPT-HG pretrain: uses ALL Area_1 scenes, coords/colors + augmented unlabeled
# views only; no GT and no GT-derived class weights are used.
# output_root: experiments/odpt_hg/pretrain
# ---------------------------------------------------------------------------- #
output_root: experiments/odpt_hg/pretrain