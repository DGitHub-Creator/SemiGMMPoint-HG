model:
  NAME: SemiGMMBaseSeg
  encoder_args:
    NAME: PointNextEncoder
    blocks: [1, 3, 5, 3, 3]
    strides: [1, 4, 4, 4, 4]
    sa_layers: 1
    sa_use_res: False
    width: 32
    in_channels: 4
    expansion: 4
    radius: 0.1
    nsample: 32
    aggr_args:
      feature_type: 'dp_fj'
      reduction: 'max'
    group_args:
      NAME: 'ballquery'
      normalize_dp: True
    conv_args:
      order: conv-norm-act
    act_args:
      act: 'relu'
    norm_args:
      norm: 'bn'
  decoder_args:
    NAME: GMMPointNextDecoder
  cls_args:
    NAME: PointNextGMMSeg
    num_classes: 6
    ignore_index: 255
decoder_params:
    embed_dim: 64
    num_components: 5
    factor_n: 1
    factor_c: 1
    factor_p: 1
    mem_size: 36000
    max_sample_size: 40
    update_GMM_interval: 5
    update_loop: 5
preTrain:
  is_pretrain: True
max_unsupervised: 0
unbranch_freq: 2
uncriterion_args:
  NAME: GudiePointContrastLoss
  label_smoothing: 0.1
  npos: 4096
  T: 0.4
  is_guide: False
  ignore_index: 255
  max_guide_iter: 10
  # v2 aggressive: all six classes enabled with two-view agreement + rank gate.
  confidence_threshold: [0.45, 0.30, 0.45, 0.30, 0.55, 0.40]
  class_acceptance_fraction: [0.05, 0.03, 0.50, 0.03, 0.05, 0.02]
preLoadGMMConfig:
  is_load_gmm: False
  pretrain_path: null
pretrained_path:
dataset:
  common:
    NAME: ODPTS3DISHG
    dataset_root: /path/to/odpt-hg-dataset
    data_root: /path/to/odpt-hg-data
    split_file: splits/20.txt
    val_scenes: [Area_1_conferenceRoom_3, Area_1_conferenceRoom_7]
    test_scenes: [Area_3_conferenceRoom_20, Area_3_conferenceRoom_21, Area_3_conferenceRoom_22]
    voxel_size: 0.03
  train:
    split: train
    mode: labeled
    voxel_max: 48000
    loop: 30
    presample: False
  val:
    split: val
    mode: val
    voxel_max: null
    presample: False
  test:
    split: test
    mode: test
    voxel_max: null
    presample: False
undataset:
  common:
    NAME: ODPTPreS3DISHG
    dataset_root: /path/to/odpt-hg-dataset
    data_root: /path/to/odpt-hg-data
    split_file: splits/20.txt
    val_scenes: [Area_1_conferenceRoom_3, Area_1_conferenceRoom_7]
    voxel_size: 0.03
  train:
    split: train
    mode: unlabeled
    voxel_max: 36000 # 36000
    # Bound GMM/pseudo-label drift to about 2 DDP steps per unsupervised epoch.
    loop: 1
    presample: False
batch_size: 2
unbatch_size: 2
# ---------------------------------------------------------------------------- #
# ODPT-HG 20% config: labeled scenes per splits/20.txt (Area_1 scene 1,5,6),
# unlabeled = remaining 12 Area_1 scenes (y replaced by 255), test = Area_3
# 20/21/22. pretrained_path is injected by scripts/odpt_hg at launch time from
# experiments/odpt_hg/pretrain/checkpoints/final.pth.
# output_root: experiments/odpt_hg/20pct
# ---------------------------------------------------------------------------- #
output_root: experiments/odpt_hg/20pct
